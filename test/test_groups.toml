# Root umbrella package's own test groups (group x version matrix).
# The lib/* sublibraries are covered by SublibraryCI.yml (project model) and are
# intentionally not re-tested through this root matrix.
[Core]
versions = ["lts", "1", "pre"]

["Core 32-bit"]
group = "Core"
versions = ["1"]
os = ["ubuntu-latest"]
arch = "x86"

[QA]
versions = ["lts", "1"]
